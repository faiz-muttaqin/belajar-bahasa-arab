name: Verify full-sentence grammar
on:
  pull_request:
    paths:
      - 'src/lib/content/sentence-rules*'
      - 'src/lib/components/learning/SentenceGloss.svelte'
      - 'src/routes/kaidah/**'
      - 'tests/e2e/sentence-rules.e2e.ts'
      - 'docs/data/nahwu-complete-sentences-audit.md'
      - '.github/workflows/nahwu-sentence-pr.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run browsers:install
      - run: bun run verify
