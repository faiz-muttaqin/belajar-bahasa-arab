name: Verify connected-clause grammar
on:
  pull_request:
    paths:
      - 'src/lib/content/clause-rules*'
      - 'src/lib/components/learning/ClauseGloss.svelte'
      - 'src/routes/kaidah/**'
      - 'tests/e2e/clause-rules.e2e.ts'
      - 'docs/data/nahwu-connected-clauses-audit.md'
      - '.github/workflows/nahwu-clause-pr.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run browsers:install
      - run: bun run verify
