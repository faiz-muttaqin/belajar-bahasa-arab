name: RM-05 final format
on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/rm05-final-format.yml'
permissions:
  contents: write
jobs:
  format:
    if: ${{ github.event.pull_request.number == 41 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write src/lib/progress/storage.svelte.spec.ts tests/e2e/rm05-evidence.e2e.ts src/lib/domain/roadmap/evidence.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/progress/storage.svelte.spec.ts tests/e2e/rm05-evidence.e2e.ts src/lib/domain/roadmap/evidence.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(rm05): finish formatting new migration tests"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
