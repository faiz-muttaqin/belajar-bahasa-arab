name: P7 static dictionary scale benchmark

on:
  pull_request:
    paths:
      - 'scripts/p7-dictionary-benchmark.ts'
      - '.github/workflows/p7-dictionary-benchmark-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - name: Check formatter
        run: bun run --silent prettier --check scripts/p7-dictionary-benchmark.ts
      - name: Profile 10k, 25k and 50k synthetic lemmas
        run: |
          mkdir -p /tmp/p7-benchmark
          bun scripts/p7-dictionary-benchmark.ts /tmp/p7-benchmark/results.json
          test -s /tmp/p7-benchmark/results.json
      - uses: actions/upload-artifact@v4
        with:
          name: p7-dictionary-scale-benchmark
          path: /tmp/p7-benchmark/results.json
          if-no-files-found: error
