name: Temporary format research PR
on:
  push:
    branches:
      - feat/research-evidence-msa-pilot-20261117
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write docs/decisions/0005-research-verification.md src/lib/components/learning/MsaVocabulary.svelte src/lib/content/msa-research.ts src/lib/domain/research/evidence.spec.ts src/lib/domain/research/evidence.ts src/lib/domain/vocabulary/types.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/decisions/0005-research-verification.md src/lib/components/learning/MsaVocabulary.svelte src/lib/content/msa-research.ts src/lib/domain/research/evidence.spec.ts src/lib/domain/research/evidence.ts src/lib/domain/vocabulary/types.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format research evidence pilot"
            git push origin HEAD:${{ github.ref_name }}
          fi
