name: Verify D-05a inline source-linked examples
on:
  pull_request:
    paths:
      - 'src/lib/domain/grammar/**'
      - 'src/lib/components/learning/GrammarExample.svelte'
      - 'src/lib/components/learning/PhraseGloss.svelte'
      - 'src/lib/components/learning/InlineCuratedExamplePicker.svelte'
      - 'tests/e2e/grammar-inline-examples.e2e.ts'
      - 'docs/data/dynamic-inline-examples-audit.md'
      - '.github/workflows/grammar-inline-examples-pr.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run browsers:install
      - run: bun run verify
