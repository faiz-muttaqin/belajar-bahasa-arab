name: Verify sharaf reference

on:
  pull_request:
    paths:
      - 'src/lib/components/layout/DesktopSidebar.svelte'
      - 'src/lib/components/layout/SiteHeader.svelte'
      - 'src/lib/navigation.ts'
      - 'src/routes/+layout.svelte'
      - 'src/lib/components/learning/TransposedTashrif.svelte'
      - 'src/lib/content/sharaf.ts'
      - 'src/lib/content/sharaf-staging-preview.ts'
      - 'src/lib/catalog/search.ts'
      - 'src/routes/cari/**'
      - 'data/sharaf-upstream/**'
      - 'static/data/sharaf-lexicon-v1.json'
      - 'scripts/build-sharaf-lexicon.mjs'
      - 'tests/e2e/sharaf-full-import.e2e.ts'
      - 'src/lib/catalog/storage.ts'
      - 'src/lib/catalog/sync.svelte.ts'
      - 'src/lib/domain/sharaf/**'
      - 'src/routes/rujukan/**'
      - 'src/routes/sharaf/**'
      - 'src/routes/data/sharaf.json/**'
      - 'tests/e2e/sharaf-matrix.e2e.ts'
      - 'tests/e2e/sharaf-staging-cache.e2e.ts'
      - 'tests/e2e/public-lessons.e2e.ts'
      - 'tests/e2e/catalog.e2e.ts'
      - '.github/workflows/sharaf-pr.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun scripts/build-sharaf-lexicon.mjs --check
      - run: bun run browsers:install
      - run: bun run verify
