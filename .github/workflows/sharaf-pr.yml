name: Verify sharaf reference

on:
  pull_request:
    paths:
      - 'src/lib/components/learning/TransposedTashrif.svelte'
      - 'src/lib/content/sharaf.ts'
      - 'src/lib/domain/sharaf/**'
      - 'src/routes/rujukan/**'
      - 'src/routes/sharaf/**'
      - 'src/routes/data/sharaf.json/**'
      - 'tests/e2e/sharaf-matrix.e2e.ts'
      - '.github/workflows/sharaf-pr.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun run browsers:install
      - run: bun run test:unit --run
      - run: bun run build
      - run: bunx playwright test tests/e2e/sharaf-matrix.e2e.ts
