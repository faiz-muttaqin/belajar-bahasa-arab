name: Verify learning roadmap data
on:
  pull_request:
    paths:
      - 'src/lib/content/competencies*'
      - 'src/lib/content/roadmap*'
      - 'src/lib/content/lessons/index.ts'
      - 'src/lib/domain/roadmap/**'
      - 'playwright.config.ts'
      - '.github/workflows/learning-roadmap-pr.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run browsers:install
      - run: bun run verify
