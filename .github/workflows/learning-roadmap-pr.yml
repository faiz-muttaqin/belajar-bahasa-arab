name: Verify learning roadmap
on:
  # Stacked PRs are also verified directly when their head branch changes.
  push:
    branches:
      - 'feat/rm06-*'
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/learning-roadmap-pr.yml'
  pull_request:
    paths:
      - 'src/lib/content/competencies*'
      - 'src/lib/content/roadmap*'
      - 'src/lib/content/checkpoints*'
      - 'src/routes/belajar/checkpoint-2/**'
      - 'tests/e2e/rm06-checkpoint-stage2.e2e.ts'
      - 'src/lib/content/lessons/u1-meaning-practice.ts'
      - 'src/lib/content/lessons/types.ts'
      - 'src/lib/components/learning/MeaningPractice.svelte'
      - 'src/lib/components/learning/RoadmapStage.svelte'
      - 'src/routes/belajar/checkpoint-3/**'
      - 'tests/e2e/rm06-checkpoint.e2e.ts'
      - 'src/lib/content/lessons/index.ts'
      - 'src/lib/domain/roadmap/**'
      - 'src/lib/progress/**'
      - 'src/lib/components/learning/*Roadmap*.svelte'
      - 'src/routes/belajar/+page*'
      - 'src/routes/progres/**'
      - 'tests/e2e/learning-roadmap.e2e.ts'
      - 'tests/e2e/roadmap-progress.e2e.ts'
      - 'tests/e2e/rm05-evidence.e2e.ts'
      - 'playwright.config.ts'
      - '.github/workflows/learning-roadmap-pr.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - name: Normalize tracker before final verification (one-time)
        if: ${{ github.event_name == 'push' && github.ref_name == 'feat/rm06-checkpoint-stage2-40-variants-20261116' }}
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          bunx prettier --write docs/content/tracker.md
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add docs/content/tracker.md
            git commit -m 'style: normalize RM-06 Stage 2 content tracker'
            git push origin "HEAD:${SOURCE_BRANCH}"
          fi
      - run: bun run browsers:install
      - run: bun run verify
