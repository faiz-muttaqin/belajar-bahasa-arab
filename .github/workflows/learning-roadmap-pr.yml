name: Verify learning roadmap
on:
  pull_request:
    paths:
      - 'src/lib/content/competencies*'
      - 'src/lib/content/roadmap*'
      - 'src/lib/content/checkpoints*'
      - 'src/routes/belajar/checkpoint-2/**'
      - 'tests/e2e/rm06-checkpoint-stage2.e2e.ts'
      - 'src/lib/content/lessons/u1-meaning-practice.ts'
      - 'src/lib/content/lessons/types.ts'
      - 'src/lib/components/learning/MeaningPractice.svelte'
      - 'src/lib/components/learning/RoadmapStage.svelte'
      - 'src/routes/belajar/checkpoint-3/**'
      - 'tests/e2e/rm06-checkpoint.e2e.ts'
      - 'src/lib/content/lessons/index.ts'
      - 'src/lib/domain/roadmap/**'
      - 'src/lib/progress/**'
      - 'src/lib/components/learning/*Roadmap*.svelte'
      - 'src/routes/belajar/+page*'
      - 'src/routes/progres/**'
      - 'tests/e2e/learning-roadmap.e2e.ts'
      - 'tests/e2e/roadmap-progress.e2e.ts'
      - 'tests/e2e/rm05-evidence.e2e.ts'
      - 'playwright.config.ts'
      - '.github/workflows/learning-roadmap-pr.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - name: Commit Prettier normalization on the PR branch (temporary)
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.number == 42 || github.event.pull_request.number == 43) }}
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          bunx prettier --write .
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -u
            git commit -m 'style: format RM-06 checkpoint source and tests'
            git push origin "HEAD:${PR_BRANCH}"
          fi
      - run: bun run browsers:install
      - run: bun run verify
