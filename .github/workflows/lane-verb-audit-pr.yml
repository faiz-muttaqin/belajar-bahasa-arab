name: Audit unresolved Lane verbs

on:
  pull_request:
    paths:
      - 'scripts/lane/**'
      - 'docs/data/lane-verb-audit-p3.md'
      - 'data/recall/verbs-qutrub-arramooz-recall.json'
      - 'data/wiktionary/verbs-form-i*.json'
      - 'data/sharaf-upstream/**'
      - '.github/workflows/lane-verb-audit-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: alpheios-project/lan
          ref: 7dd04e1182c13a4b0883978867d2a3b04616542a
          path: lane-source
          persist-credentials: false
      - name: Verify static enrichment matches source
        working-directory: project
        run: |
          node scripts/build-verb-enrichment.mjs
          git diff --exit-code -- static/data/verbs-enrich-v1.json
          node scripts/check-sources.mjs
      - name: Test
        run: python3 -m unittest discover -s project/scripts/lane -p 'test_*.py'
      - name: Extract and audit
        run: |
          python3 project/scripts/lane/extract_lane_full.py lane-source lane-output
          python3 project/scripts/lane/audit_unresolved_verbs.py project/data/recall/verbs-qutrub-arramooz-recall.json lane-output audit-output
          python3 project/scripts/lane/audit_unresolved_verbs.py project/data/recall/verbs-qutrub-arramooz-recall.json lane-output audit-repeat
          diff -r audit-output audit-repeat
          cat audit-output/summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: Cross-check all 537 records against Wiktionary and morphology sources
        run: |
          python3 project/scripts/lane/crosscheck_p3.py project audit-output crosscheck-output
          python3 project/scripts/lane/crosscheck_p3.py project audit-output crosscheck-repeat > /dev/null
          diff -r crosscheck-output crosscheck-repeat
          cat crosscheck-output/summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: lane-verb-review-p3
          path: audit-output/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: p3-crosscheck-all
          path: crosscheck-output/
          if-no-files-found: error
          retention-days: 30
      - name: Search four classical dictionaries (reference only)
        run: |
          python3 project/scripts/lane/search_classical_p3.py audit-output classical-cache classical-output
          python3 project/scripts/lane/search_classical_p3.py audit-output classical-cache classical-repeat > /dev/null
          diff -r classical-output classical-repeat
          cat classical-output/summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: p3-classical-locators
          path: classical-output/
          if-no-files-found: error
          retention-days: 30
