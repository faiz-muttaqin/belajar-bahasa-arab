name: P7 format diagnostic (temporary)

on:
  pull_request:
    paths:
      - 'docs/data/p7-verb-priority-context-audit.md'
      - '.github/workflows/p7-format-diagnostic-pr.yml'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - name: Show Prettier-normalized report
        run: |
          bunx prettier --write docs/data/p7-verb-priority-context-audit.md
          python3 - <<'PY'
          import json
          from pathlib import Path
          file = "docs/data/p7-verb-priority-context-audit.md"
          print("P7_FORMATTED " + json.dumps({"path": file, "content": Path(file).read_text(encoding="utf-8")}, ensure_ascii=False))
          PY
