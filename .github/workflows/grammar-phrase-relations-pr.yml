name: Verify D-04b phrase and clause relations
on:
  pull_request:
    paths:
      - 'src/lib/domain/grammar/**'
      - 'src/lib/content/phrase-rules.ts'
      - 'src/lib/content/clause-rules.ts'
      - 'src/lib/content/reference-isim.ts'
      - 'docs/data/dynamic-example-phrase-relations-audit.md'
      - '.github/workflows/grammar-phrase-relations-pr.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run browsers:install
      - run: bun run verify
