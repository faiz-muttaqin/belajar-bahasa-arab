name: Temporary formatter for F-16
on:
  push:
    branches:
      - 'feat/arabic-morphology-guides-20261115'
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/arabic-morphology-guides-20261115
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run format
      - name: Commit formatted sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --staged --quiet; then
            git commit -m 'style(content): format F-16 taxonomy and guides'
            git push origin HEAD:refs/heads/feat/arabic-morphology-guides-20261115
          fi
