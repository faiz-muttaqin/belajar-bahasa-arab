name: Verify footer and Iqra content

on:
  pull_request:
    paths:
      - 'src/lib/components/layout/SiteFooter.svelte'
      - 'src/lib/content/harakat-reference.ts'
      - 'src/lib/content/harakat-reference.spec.ts'
      - 'src/lib/content/lessons/foundation.ts'
      - 'src/routes/iqra/+page.svelte'
      - 'tests/e2e/footer-iqra-harakat.e2e.ts'
      - '.github/workflows/footer-iqra-pr.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run browsers:install
      - run: bun run verify
