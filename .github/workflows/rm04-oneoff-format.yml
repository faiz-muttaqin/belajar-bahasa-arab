name: RM-04 one-off format
on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/rm04-oneoff-format.yml'
permissions:
  contents: write
jobs:
  format:
    if: ${{ github.event.pull_request.number == 40 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Apply repository Prettier config to RM-04 changes
        run: >
          bunx prettier --write
          docs/content/tracker.md
          src/lib/components/learning/LearningRoadmap.svelte
          src/lib/components/learning/RoadmapStage.svelte
          src/lib/progress/backup.spec.ts
          src/lib/progress/lessons.ts
          src/routes/progres/+page.svelte
          tests/e2e/roadmap-progress.e2e.ts
      - name: Commit only formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/content/tracker.md src/lib/components/learning/LearningRoadmap.svelte src/lib/components/learning/RoadmapStage.svelte src/lib/progress/backup.spec.ts src/lib/progress/lessons.ts src/routes/progres/+page.svelte tests/e2e/roadmap-progress.e2e.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(rm04): apply repository Prettier formatting"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
