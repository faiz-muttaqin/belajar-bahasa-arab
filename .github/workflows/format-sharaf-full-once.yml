name: One-time format full sharaf import

on:
  pull_request:
    paths:
      - '.github/workflows/format-sharaf-full-once.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/sharaf-full-qutrub-arramooz-20261114'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - name: Format changed app code and docs only
        run: |
          bunx prettier --write \
            src/lib/domain/sharaf/bulk.ts \
            src/lib/domain/sharaf/bulk.spec.ts \
            src/lib/catalog/sync.svelte.ts \
            src/lib/catalog/storage.ts \
            src/lib/catalog/search.ts \
            src/lib/components/learning/TransposedTashrif.svelte \
            src/routes/sharaf/+page.svelte \
            src/routes/cari/+page.svelte \
            scripts/build-sharaf-lexicon.mjs \
            tests/e2e/sharaf-full-import.e2e.ts \
            tests/e2e/sharaf-staging-cache.e2e.ts \
            docs/data/sharaf-full-import.md \
            docs/content/tracker.md
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add src/lib/domain/sharaf/bulk.ts src/lib/domain/sharaf/bulk.spec.ts src/lib/catalog/sync.svelte.ts src/lib/catalog/storage.ts src/lib/catalog/search.ts src/lib/components/learning/TransposedTashrif.svelte src/routes/sharaf/+page.svelte src/routes/cari/+page.svelte scripts/build-sharaf-lexicon.mjs tests/e2e/sharaf-full-import.e2e.ts tests/e2e/sharaf-staging-cache.e2e.ts docs/data/sharaf-full-import.md docs/content/tracker.md
            git commit -m "style(sharaf): format full-source import using project Prettier"
            git push origin HEAD:feat/sharaf-full-qutrub-arramooz-20261114
          fi
