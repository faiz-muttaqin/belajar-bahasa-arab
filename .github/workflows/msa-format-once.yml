name: Format MSA vocabulary once

on:
  pull_request:
    paths:
      - '.github/workflows/msa-format-once.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/msa-common-lexicon-20261114'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - name: Format modified files
        run: |
          bunx prettier --write \
            docs/content/tracker.md \
            docs/data/msa-common.md \
            src/lib/catalog/search.ts \
            src/lib/components/learning/MsaVocabulary.svelte \
            src/lib/content/msa-vocabulary.ts \
            src/lib/content/vocabulary.ts \
            src/lib/domain/vocabulary/msa.spec.ts \
            src/lib/domain/vocabulary/types.ts \
            src/lib/server/catalog.ts \
            src/routes/kosakata/+page.svelte \
            tests/e2e/msa-vocabulary.e2e.ts \
            tests/e2e/quran-vocabulary.e2e.ts
      - name: Push Prettier output to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add docs/content/tracker.md docs/data/msa-common.md src/lib/catalog/search.ts src/lib/components/learning/MsaVocabulary.svelte src/lib/content/msa-vocabulary.ts src/lib/content/vocabulary.ts src/lib/domain/vocabulary/msa.spec.ts src/lib/domain/vocabulary/types.ts src/lib/server/catalog.ts src/routes/kosakata/+page.svelte tests/e2e/msa-vocabulary.e2e.ts tests/e2e/quran-vocabulary.e2e.ts
            git commit -m "style(msa): apply project Prettier formatting"
            git push origin HEAD:feat/msa-common-lexicon-20261114
          fi
