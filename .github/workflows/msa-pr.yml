name: Verify common MSA vocabulary

on:
  pull_request:
    paths:
      - 'src/lib/content/msa-vocabulary.ts'
      - 'src/lib/content/vocabulary.ts'
      - 'src/lib/components/learning/MsaVocabulary.svelte'
      - 'src/lib/domain/vocabulary/**'
      - 'src/lib/catalog/search.ts'
      - 'src/lib/server/catalog.ts'
      - 'src/routes/kosakata/**'
      - 'tests/e2e/msa-vocabulary.e2e.ts'
      - '.github/workflows/msa-pr.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run browsers:install
      - run: bun run verify
