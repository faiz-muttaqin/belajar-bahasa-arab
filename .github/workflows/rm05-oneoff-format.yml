name: RM-05 one-off format
on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/rm05-oneoff-format.yml'
permissions:
  contents: write
jobs:
  format:
    if: ${{ github.event.pull_request.number == 41 && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Prettier RM-05 changes
        run: bunx prettier --write docs/content/tracker.md docs/plans/peta-belajar.md src/lib/components/learning/LearningRoadmap.svelte src/lib/components/learning/LessonReader.svelte src/lib/components/learning/MeaningPractice.svelte src/lib/components/learning/RoadmapStage.svelte src/lib/components/learning/RoadmapStepDetails.svelte src/lib/components/learning/SelfAssessment.svelte src/lib/content/lessons/types.ts src/lib/domain/roadmap/evidence.spec.ts src/lib/domain/roadmap/evidence.ts src/lib/progress/answers.ts src/lib/progress/storage.ts src/routes/progres/+page.svelte tests/e2e/rm05-evidence.e2e.ts
      - name: Commit exact formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/content/tracker.md docs/plans/peta-belajar.md src/lib/components/learning/LearningRoadmap.svelte src/lib/components/learning/LessonReader.svelte src/lib/components/learning/MeaningPractice.svelte src/lib/components/learning/RoadmapStage.svelte src/lib/components/learning/RoadmapStepDetails.svelte src/lib/components/learning/SelfAssessment.svelte src/lib/content/lessons/types.ts src/lib/domain/roadmap/evidence.spec.ts src/lib/domain/roadmap/evidence.ts src/lib/progress/answers.ts src/lib/progress/storage.ts src/routes/progres/+page.svelte tests/e2e/rm05-evidence.e2e.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(rm05): apply repository Prettier formatting"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
