name: Temporary format masdar PR
on:
  push:
    branches:
      - feat/oer02-masdar-formal-reading-20261117
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write docs/research/2026-11-17-masdar-source-audit.md src/lib/content/masdar-lessons.ts src/routes/kaidah/masdar/+page.svelte src/routes/kaidah/sharaf/+page.svelte tests/e2e/masdar-lessons.e2e.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/2026-11-17-masdar-source-audit.md src/lib/content/masdar-lessons.ts src/routes/kaidah/masdar/+page.svelte src/routes/kaidah/sharaf/+page.svelte tests/e2e/masdar-lessons.e2e.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format sourced masdar lesson"
            git push origin HEAD:${{ github.ref_name }}
          fi
