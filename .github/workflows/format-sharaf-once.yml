name: Format sharaf branch once

on:
  pull_request:
    paths:
      - '.github/workflows/format-sharaf-once.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/sharaf-lexicon-search-20261114'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - name: Format touched source files
        run: |
          bunx prettier --write \
            src/lib/components/learning/TransposedTashrif.svelte \
            src/lib/content/sharaf.ts \
            src/lib/domain/sharaf/lexicon.spec.ts \
            src/lib/domain/sharaf/lexicon.ts \
            src/lib/domain/sharaf/matrix.spec.ts \
            src/lib/domain/sharaf/matrix.ts \
            src/lib/domain/sharaf/cache.ts \
            src/routes/data/sharaf.json/+server.ts \
            src/routes/rujukan/+page.svelte \
            src/routes/sharaf/+page.svelte
      - name: Push formatter output to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add src/lib/components/learning/TransposedTashrif.svelte src/lib/content/sharaf.ts src/lib/domain/sharaf/ src/routes/data/sharaf.json/+server.ts src/routes/rujukan/+page.svelte src/routes/sharaf/+page.svelte
            git commit -m "style(sharaf): format source files with project Prettier"
            git push origin HEAD:feat/sharaf-lexicon-search-20261114
          fi
