name: Format RM-06 Stage 6 once
on:
  push:
    branches:
      - 'feat/rm06-stage6-document-transfer-20261116'
    paths:
      - '.github/workflows/format-rm06-stage6-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - name: Prettier format changed Stage 6 files
        run: |
          bunx prettier --write \
            src/lib/content/checkpoints-stage6-summaries.ts \
            src/lib/content/checkpoints-stage6-transfer.ts \
            'src/routes/belajar/checkpoint-6/+page.svelte' \
            tests/e2e/rm06-checkpoint-stage6.e2e.ts
      - name: Commit formatting to PR branch
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              src/lib/content/checkpoints-stage6-summaries.ts \
              src/lib/content/checkpoints-stage6-transfer.ts \
              'src/routes/belajar/checkpoint-6/+page.svelte' \
              tests/e2e/rm06-checkpoint-stage6.e2e.ts
            git commit -m "style: format RM-06 Stage 6 files"
            git push origin HEAD:feat/rm06-stage6-document-transfer-20261116
          fi
