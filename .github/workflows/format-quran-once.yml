name: Format Quran vocabulary once

on:
  pull_request:
    paths:
      - '.github/workflows/format-quran-once.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/quran-vocab-frequency-filters-20261114'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - name: Format touched files
        run: |
          bunx prettier --write \
            docs/content/tracker.md \
            docs/data/quran-vocabulary.md \
            docs/data/quran-frequency-method.md \
            src/lib/components/learning/QuranVocabulary.svelte \
            src/lib/components/learning/VocabCard.svelte \
            src/lib/content/quran-vocabulary.ts \
            src/lib/content/quran-frequency.ts \
            src/lib/domain/vocabulary/types.ts \
            src/lib/domain/vocabulary/frequency.ts \
            src/lib/domain/vocabulary/frequency.spec.ts \
            src/routes/kosakata/+page.svelte \
            tests/e2e/quran-vocabulary.e2e.ts
      - name: Push format to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add docs/content/tracker.md docs/data/quran-vocabulary.md docs/data/quran-frequency-method.md src/lib/components/learning/QuranVocabulary.svelte src/lib/components/learning/VocabCard.svelte src/lib/content/quran-vocabulary.ts src/lib/content/quran-frequency.ts src/lib/domain/vocabulary/types.ts src/lib/domain/vocabulary/frequency.ts src/lib/domain/vocabulary/frequency.spec.ts src/routes/kosakata/+page.svelte tests/e2e/quran-vocabulary.e2e.ts
            git commit -m "style(quran): apply project Prettier format"
            git push origin HEAD:feat/quran-vocab-frequency-filters-20261114
          fi
