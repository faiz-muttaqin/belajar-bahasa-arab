name: Temporary format participle PR
on:
  push:
    branches:
      - feat/oer02b-participles-20261120
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write docs/plans/IMPLEMENTATION_STATUS.md docs/plans/implementation-status.json docs/research/2026-11-20-participle-source-audit.md src/lib/content/participle-lessons.spec.ts src/lib/content/participle-lessons.ts src/routes/kaidah/participle/+page.svelte tests/e2e/participle-lessons.e2e.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/plans/IMPLEMENTATION_STATUS.md docs/plans/implementation-status.json docs/research/2026-11-20-participle-source-audit.md src/lib/content/participle-lessons.spec.ts src/lib/content/participle-lessons.ts src/routes/kaidah/participle/+page.svelte tests/e2e/participle-lessons.e2e.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format participle lesson and plan evidence"
            git push origin HEAD:${{ github.ref_name }}
          fi
