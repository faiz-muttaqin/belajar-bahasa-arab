name: Verify sharaf learning

on:
  pull_request:
    paths:
      - 'src/lib/content/sharaf-lessons*'
      - 'src/lib/components/learning/SharafForms.svelte'
      - 'src/routes/kaidah/**'
      - 'src/routes/sharaf/+page.svelte'
      - 'tests/e2e/sharaf-lessons.e2e.ts'
      - '.github/workflows/sharaf-learning-pr.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bun run browsers:install
      - run: bun run verify
