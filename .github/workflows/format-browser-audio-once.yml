name: One-time format browser Arabic audio

on:
  pull_request:
    paths:
      - '.github/workflows/format-browser-audio-once.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/browser-arabic-audio-20261114'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - name: Apply repository Prettier
        run: |
          bunx prettier --write \
            src/lib/audio/speech.svelte.ts \
            src/lib/components/learning/AudioPlayButton.svelte \
            src/lib/components/learning/SpeechSettings.svelte \
            src/lib/components/learning/VocabCard.svelte \
            src/lib/components/learning/LessonReader.svelte \
            src/lib/components/learning/WordGlossary.svelte \
            src/lib/components/learning/SentenceBreakdown.svelte \
            src/lib/components/learning/SentenceWordNotes.svelte \
            src/lib/components/learning/TransposedTashrif.svelte \
            src/routes/+layout.svelte \
            src/routes/kosakata/+page.svelte \
            src/routes/sharaf/+page.svelte \
            docs/audio/browser-speech.md \
            docs/content/tracker.md \
            tests/e2e/browser-arabic-audio.e2e.ts
      - name: Commit formatter changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add src/lib/audio/ src/lib/components/learning/ src/routes/+layout.svelte src/routes/kosakata/+page.svelte src/routes/sharaf/+page.svelte docs/audio/browser-speech.md docs/content/tracker.md tests/e2e/browser-arabic-audio.e2e.ts
            git commit -m "style(audio): run project Prettier on browser speech feature"
            git push origin HEAD:feat/browser-arabic-audio-20261114
          fi
