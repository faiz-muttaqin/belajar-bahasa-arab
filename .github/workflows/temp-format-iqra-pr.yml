name: Temporary format Iqra PR
on:
  push:
    branches:
      - feat/rm06-iqra-optional-reading-selfcheck-20261117
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write src/lib/content/checkpoints-iqra.ts src/lib/content/roadmap.ts src/routes/belajar/checkpoint-iqra/+page.svelte tests/e2e/rm06-checkpoint-iqra.e2e.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/content/checkpoints-iqra.ts src/lib/content/roadmap.ts src/routes/belajar/checkpoint-iqra/+page.svelte tests/e2e/rm06-checkpoint-iqra.e2e.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Prettier to Iqra checkpoint"
            git push origin HEAD:${{ github.ref_name }}
          fi
