name: Format RM-06 Stage 4 once
on:
  push:
    branches:
      - 'feat/rm06-checkpoint-stage4-40-transfer-20261116'
    paths:
      - '.github/workflows/format-rm06-stage4-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - run: bun install --frozen-lockfile
      - name: Format Stage 4 changed files
        run: |
          bunx prettier --write \
            docs/plans/peta-belajar.md \
            src/lib/content/checkpoints-stage4.spec.ts \
            src/lib/content/checkpoints-stage4.ts \
            'src/routes/belajar/checkpoint-4/+page.svelte'
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              docs/plans/peta-belajar.md \
              src/lib/content/checkpoints-stage4.spec.ts \
              src/lib/content/checkpoints-stage4.ts \
              'src/routes/belajar/checkpoint-4/+page.svelte'
            git commit -m "style: format RM-06 Stage 4 files"
            git push origin HEAD:feat/rm06-checkpoint-stage4-40-transfer-20261116
          fi
